$(document).ready( () => {
    
 
    try {
    const socket = io('http://localhost:5000');

    socket.on('connect', function(){
        /* tells socketio to look for connect event which is when user loads a page. n then log 'Connected' to the console */

    });

    socket.on('disconnect', function() {
        chatConnectionManager("Connected", "Success");
    });

    /*  */

    const txt_chat = $('#chat-box').val()
    payload = {
        'to' : 0,
        'fro' : socket.id,
        'text' : '',
        'sticker' : '',
        'media' : '',
        'client': true,
        }

    // on-typing
    $('#chat-box').on('input', () => {
        payload.text = txt_chat //update payload text b/4 sending
        socket.emit('typing', payload);
        console.log('from-typing client-event', payload)
    });

  // Listening to messages from the server
    socket.on('chat', (event) => {

    $('#messages').append( $('<li>').text(event.chat));
        // parse the data from string to JSON object
        const data = JSON.parse(event.data);
        // If the message is of type connect
        // set the client id
        if (data["type"] == "connect"){
            fro = data["fro"];
        } else if (data["type"] == "disconnected"){
        // if another client gets disconnected show the current client
        // that the other user left
        chatConnectionManager("Disconnected", `Client ` + data["id"]);

        } else if (data["type"] == "chat"){
        // Handle chat messages here
        // Example:
        const fro = data["fro"];
        const text = data["text"];

        chatConnectionManager("New Chat", `${fro}: ${text}`);
        
        }

        });
    
        /* algo-chat-app */
        socket.emit('request', save_chat={});
        socket.emit('request', update_chat={});
        socket.emit('request', fetch_chat={});
        socket.emit('request', remove_chat={});

    //sending chat-msg to the server.
    $('#chat-form').submit( (event) => {
        event.preventDefault();
        const txt = $('#chat-box').val();
        payload.text = txt //update payload b/4 sending
        socket.emit('chat', payload);
        console.log('from-form-submission', payload)

        $('#chat-box').val('');
    });
        

  socket.onerror = (event) => {
    console.log("Failed to connect to websocket");
    chatConnectionManager("Failed to Connect", "Error");
  };

  socket.onclose = (event) => {
    chatConnectionManager("Disconnected", "Client disconnected");
    console.log("Connection closed");
  };

} catch (e) {
  console.log(e);
  chatConnectionManager("Failed to Connect", "Error");
}

function updateSelectedColors(input) {
    // Get the selected color value from color2
    var selectedColorValue = input.value;
    
    // Get the current value of the hidden input field
    var currentValue = $('#color').val();
    var colorField = $('#color');

    // Concatenate the selected color value to the current value with a separator
    var updatedValue = currentValue + (currentValue ? ', ' : '') + selectedColorValue;

    // Set the value of the hidden input field
    $(colorField).val(updatedValue);

    // Set the value of the color input to the accumulated selected colors
    if (updatedValue) {
        $(colorField).val(updatedValue);
    } else {
        $(colorField).val(null); // Set to None
    }
}

const inputElement = document.querySelector('.filepond');
const pond = FilePond.create(inputElement, {
name: 'images', // Match the name of your Flask-WTF field
allowFileTypeValidation: true,
allowFileSizeValidation: true,
maxFileSize: '10MB',
minFileSize: '1KB',
maxTotalFileSize: '50MB',
maxFiles: 15, // Set the maximum number of files users can upload
imageResizeTargetWidth: 20,
imageResizeTargetHeight: 10,
storeAsFile: true,
allowRemove: true,
allowRevert: true,
dropValidation: true,
checkValidity: true,
dropOnPage: true,
allowMultiple: true, // Allow multiple files to be selected

onaddfile: function (error, fileItem) {
// This event is triggered when a file is added
const previewContainer = $('.preview-container');
const fileId = fileItem.id;

const previewElement = $(`
    <div class="file-preview p-2" data-file-id="${fileId}">
        <i class="ecicon eci-close file-action-button p-1 rounded bg-secondary text-danger"></i>
    </div>
`);

previewContainer.append(previewElement);

// Add real-time preview for images and videos
if (fileItem.file.type.startsWith('image/') || fileItem.file.type.startsWith('video/')) {
    const fileReader = new FileReader();
    fileReader.onload = function (e) {
        const preview = document.createElement(fileItem.file.type.startsWith('image/') ? 'img' : 'video');
        preview.src = e.target.result;
        if (fileItem.file.type.startsWith('video/')) {
            preview.controls = true;
        }
        previewElement.append(preview);
        
    };

    fileReader.readAsDataURL(fileItem.file);

    // Add a click event handler to the delete button for this file
    previewElement.find('.file-action-button').on('click', function () {
        // Remove the file from FilePond using the fileId
        pond.removeFile(fileId);

    });
}
},

onremovefile: function (error, fileItem) {
// This event is triggered when a file is removed
// Remove the corresponding preview element
const previewContainer = $('.preview-container');
const previews = previewContainer.find('.file-preview');
previews.each(function () {
    if ($(this).data('file-id') === fileItem.id) {
        $(this).remove();
        return false;
    }
});
},
});

//const url = "{{ url_for('listing_api.create_listing') }}";
const url = "{{ url_for('acct.post') }}";
const post_btn = $('#save_listing').html();

$(post_btn, '#response').html('<i class="fa fa-circle-notch fa-spin fa-1x fa-fw"></i>').addClass('disabled').addClass('primary');
// Include the CSRF token in the request headers

$.ajax({
    url: url,
    type: 'POST',
    data: formData,
    contentType: false,
    processData: false,
    success: function (r){

        $('#save_listing').html(post_btn); //reset spinning submit-btn

        // Check if there are issues with link, response, or flash
        if (r.hasOwnProperty("link") || r.hasOwnProperty("response") || r.hasOwnProperty("flash")) {
            // Handle properties as needed
            // Note: You can also use typeof to further validate the type of these properties if needed
            if (typeof r.response !== "undefined"){
                // Handle response
                $('#response').html(r.response).addClass(r.flash);
            }
            if (typeof r.flash !== "undefined") {
                // Handle flash
                $('#response').addClass(r.flash);
            }
            if (typeof r.link !== "undefined") {
                // Handle link
                $('#response').append(' -> <a href="' + r.link + '">Continue</a>');
            }
        }else {
            // Handle other cases
            $('#response').text('sent-request->'+ JSON.stringify(r)).addClass('alert-warning');
        }

        $('#save_listing').html(post_btn).removeClass('disabled'); 

        return true;
    },
    error: function (xhr, status, err) {
        $('#response').text('Request Failed'+ JSON.stringify(err) ).addClass('alert-primary')
        $('#save_listing').html(post_btn).removeClass('disabled'); //reset spinning submit-btn
        console.log(err);
        return;
        },
    complete: function (){
        // Reset the submit button after the request is complete
        $('#save_listing').html(post_btn).removeClass('disabled');
        // Set a timeout to remove the message after the specified time
        setTimeout(function() {
            $('#response').removeClass('alert').empty(); // Remove the content from the response div
        }, 10000); //30000 = half a minute, 5000==5seconds

    }, });
});
});

$(document).ready(() => {

    const cart_container = $("#cart_table_body");
    const side_cart = $('#side_cart');
    const summary_cart = $('#summary_cart');
    var cart_content_count = cart_container.children().length; //->total
    window.cart_url = "http://localhost:5000/basket/"
    fetch_url = window.cart_url + "_"
    wipe_url = window.cart_url + "wipe"
    save_url = window.cart_url + "save?item="
    remove_url = window.cart_url + "remove?item="
    update_url = window.cart_url + "update?item="

    //update_cart-ajax
    minus_qty = (item) => {
        input = $(item).next('input');

        itemid = $(input).attr('data-item');

        qty = $(input).val();

        (qty > 1) ? qty-- : "";

        update_cart(itemid, qty);

        $(input).val(qty);

    }
    //update_cart-ajax
    plus_qty = (item) => {

        input = $(item).prev('input');

        itemid = $(input).attr('data-item')

        qty = $(input).val();

        (qty < 20) ? qty++ : "";

        update_cart(itemid, qty);

        $(input).val(qty);

    }

    save_cart = (item) => {

        var itemid = item.getAttribute('data-item');

        $.get(save_url + itemid, (dt) => {

            $("#cart_modal_result").text(dt); $("#modal-cart").modal("show");

            if (dt) { $(cart_container).empty(); $(side_cart).empty(); fetch_cart(); }
        });

    }

    remove_cart = (item) => {

        var itemid = item.getAttribute('data-item');

        //$('#cart_modal_result').text('Removing From Your Basket...');

        $.get(remove_url + itemid, (dt) => {

            $("#cart_modal_result").text(dt); $("#modal-cart").modal("show");

            if (dt) { $(cart_container).empty(); $(side_cart).empty(); fetch_cart(); }
        });
    }

    update_cart = (item, qty) => {

        $.get(update_url + itemid + "&qty=" + qty, (dt) => {

            $("#cart_modal_result").text(dt); $("#modal-cart").modal("show");
            //empty/re-render elements with cart-infos when cart is updated
            if (dt) { $(cart_container).empty(); $(side_cart).empty(); $(summary_cart).empty(); fetch_cart(); }
        });

        $(input).val(qty);
    }

    wipe_cart = () => {

        $.get(wipe_url, (dt) => {

            $("#cart_modal_result").text(dt); $("#modal-cart").modal("show");

            if (dt) { $(cart_container).empty(); $(side_cart).empty(); fetch_cart(); }

        });
    }


    fetch_cart = () => {

        $.ajax({

            url: fetch_url,
            type: 'GET',
            timeout: 1000,
            success: (response) => {

                if (response.length == undefined || response.length < 1) {
                    //$(side_cart, cart_container).html(
                    $(".cart-popup, #cart_page").html(
                        "<div class='row'> <div class='col-xl-8 col-lg-10 col-md-12 m-auto text-center'> <p class='mb-20'><img src='/static/img/shape/empty.png' alt='' class='hover-up'></p> \
                        <h1 class='display-2 mb-30'>Your Cart is Empty.</h1><p class='font-lg text-grey-700 mb-30'> Add something to make us happy :)<br> Start<a href='/shop/'> \
                        <span> shopping</span></a> Home and computer accessories,shoes,watches, furniture, home supplies... </p> \
                        <p class='font-lg text-grey-700 mb-50'>..internet of sales</p> \
                        <a class='btn btn-default style3 submit-auto-width font-xs hover-up mt-30' href='/'>\
                        <i class='fi-rs-home mr-5'></i> Explore Products</a>  </div> </div> "

                    );

                    $("#item_count_lg, #item_count_sm, #sub_total").text('0'); //update totals-in-desktop-and-mobile-view, and in cart-front-end

                }

                $("#order_amt").val(response[1]);

                $("#sub_total").text(response[1]); //sub_total button

                $("#item_count_lg, #item_count_sm").text(response[2]); //@nav-item-countindicator

                $("#summary_cart_subtotal, #summary_cart_total").text("N" + response[1]); //@checkout/billing-page

                $(cart_container).append(
                    `
                    <tr>
                    <td> <a onclick="wipe_cart()" class="cart-action btn style3"> <h6> Clear Cart </h6> </a> </td>
                    <td> </td>
                    <td> </td>
                    <td> </td>
                    <td> <p class="cart-item-price">Sub Total</p> </td>
                    <td> <a href='{{url_for('pay.initiate')}}?amt=${response[1]}' 
                        class="cart-action btn style3"> <h6> Pay N${response[1]} Now </h6> </a> </td>
                    </tr>
                `
                );


                response[0]?.map(data => {

                    $(cart_container).append(
                        `
                    <tr>
                        <td> 
                            <button onclick="remove_cart(this)" data-item="${data.item}" class="cart-action style3" type="button">
                                <i class="ri-delete-bin-6-line"></i>
                            </button>
                        </td>
                        <td>
                            <div class="product-img">
                                <img src="/static/img/gen/${data.photo}" alt="Image">
                            </div>
                        </td>
                        <td>
                            <a class="cart-item" href="{{url_for('main.pages', item='${data.item}')}}">
                                <span>${data.attr}</span>
                            </a>
                        </td>
                        <td>
                            <p class="cart-item-price">${data.price}</p>
                        </td>
                        <td>
                            <div class="cart-qty">
                                <div class="product-quantity">
                                    <div class="qtySelector">
                                        <span id="minus_qty" onclick="minus_qty(this)" class="decreaseQty"> <i class="ri-subtract-line"></i></span>
                                        <input type="number"  data-item="${data.item}" min="1" max="20" class="qtyValue" value="${data.qty}" />
                                        <span id="plus_qty" onclick="plus_qty(this)" class="increaseQty"> <i class="ri-add-line"></i> </span>
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td> <p class="cart-item-price">${data.total_each}</p> </td>
                    </tr>
                `
                    );

                $(side_cart).append(
                        `
                    <div class="cart-item">
                    <div class="cart-item-action">
                        <button onclick="remove_cart(this)" data-item='${data.item}' class="delete-cart-item">
                            <i class="ri-close-circle-fill"></i>
                        </button>
                    </div>
                    <div class="cart-item-img">
                        <img src="/static/img/gen/${data.photo}" alt="Image">
                    </div>
                    <div class="cart-item-info">
                        <h5><a href="${window.shop_url + data.item}">${data.attr}</a></h5>
                        <p>${data.total_each} (${(data.qty)})</p>
                    </div>
                    </div>

                    `
                    );

                    $(summary_cart).append(
                        `
                    <div class="bill-item">
                            <p class="bill-item-name">${data.attr}</p>
                            <span class="bill-item-price">$${data.total_each}</span>
                        </div>

                    `
                    );


                });

            },

            error: (err) => { console.log(err); },


        });
    } //fetch_cart()

    fetch_cart(); //call fetch() when page is loaded

});

</script>
